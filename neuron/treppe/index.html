<!doctype html><html lang="de"><head><meta charset="UTF-8"/><meta name="viewport" content="width=1080, height=1920"/>
<script src="assets/gsap.min.js"></script>
<script type="importmap">{"imports":{"three":"./assets/three.module.min.js"}}</script>
<style>
@font-face{font-family:MO;src:url(assets/JetBrainsMono-Medium.ttf) format("truetype")}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#0c0c0e}
#root{width:1080px;height:1920px;position:relative;overflow:hidden;background:#0c0c0e}
#gl{position:absolute;left:0;top:0;width:1080px;height:1920px}
.t{position:absolute;left:0;right:0;text-align:center;font-family:MO,monospace;letter-spacing:.26em;text-transform:uppercase;color:#e4e4e8}
.lab{position:absolute;width:400px;margin-left:-200px;text-align:center;font-family:MO,monospace;letter-spacing:.26em;font-size:24px;color:#bdbdc4;text-transform:uppercase}
</style></head><body>
<div id="root" data-composition-id="main" data-start="0" data-duration="17" data-width="1080" data-height="1920">
  <canvas id="gl" width="720" height="1280"></canvas>
  <div class="t" id="t1" style="top:250px;font-size:34px">Du siehst nie die ganze Treppe.</div>
  <div class="t" id="t2" style="top:305px;font-size:34px;color:#f3d9b0">Nur die nächste Stufe.</div>
  <div class="t" id="t3" style="top:250px;font-size:34px">Geh trotzdem.</div>
  <div class="lab" id="la">Wartet</div>
  <div class="lab" id="lb">Geht los</div>
</div>
<script type="module">
import * as THREE from "three";
import { Reflector } from "./assets/Reflector.js";
window.THREE = THREE;

const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById("gl"), antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1); renderer.setSize(720, 1280, false);
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.1;
renderer.outputColorSpace = THREE.SRGBColorSpace;

const BG = 0x0c0c0e;
const scene = new THREE.Scene();
scene.background = new THREE.Color(BG);
scene.fog = new THREE.Fog(BG, 13, 24);
const cam = new THREE.PerspectiveCamera(32, 720 / 1280, 0.1, 60);

// Boden mit leichter Spiegelung, Rückwand
const mirror = new Reflector(new THREE.PlaneGeometry(40, 40), { textureWidth: 360, textureHeight: 640, color: 0x6a6a6a });
mirror.rotation.x = -Math.PI / 2; scene.add(mirror);
const floor = new THREE.Mesh(new THREE.PlaneGeometry(40, 40), new THREE.MeshStandardMaterial({ color: 0x141417, roughness: 0.6, transparent: true, opacity: 0.86 }));
floor.rotation.x = -Math.PI / 2; floor.position.y = 0.002; floor.receiveShadow = true; scene.add(floor);
const wall = new THREE.Mesh(new THREE.PlaneGeometry(40, 20), new THREE.MeshStandardMaterial({ color: 0x1e1e22, roughness: 0.95 }));
wall.position.set(0, 8, -3.2); wall.receiveShadow = true; scene.add(wall);

// Treppe: 9 Stufen, jede leuchtet erst, wenn man draufsteht
const N = 9, RUN = 0.3, RISE = 0.36, X0 = -0.55, DEPTH = 1.5;
const steps = [], edges = [];
for (let i = 0; i < N; i++) {
  const h = (i + 1) * RISE;
  const m = new THREE.MeshStandardMaterial({ color: 0x0f0f11, roughness: 0.7 });
  const s = new THREE.Mesh(new THREE.BoxGeometry(RUN, h, DEPTH), m);
  s.position.set(X0 + (i + 0.5) * RUN, h / 2, 0); s.castShadow = s.receiveShadow = true; scene.add(s);
  const em = new THREE.MeshStandardMaterial({ color: 0x000000, emissive: 0xffe2b8, emissiveIntensity: 0 });
  const e = new THREE.Mesh(new THREE.BoxGeometry(RUN, 0.012, DEPTH), em);
  e.position.set(X0 + (i + 0.5) * RUN, h + 0.007, 0); scene.add(e);
  steps.push(m); edges.push(em);
}

// Licht
scene.add(new THREE.HemisphereLight(0xb8bfcc, 0x0a0a0a, 0.32));
const front = new THREE.DirectionalLight(0xdfe3ea, 0.35); front.position.set(-3, 4, 8); scene.add(front);
const spotB = new THREE.SpotLight(0xffdcae, 120, 14, 0.42, 0.85, 1.5);
spotB.castShadow = true; spotB.shadow.mapSize.set(1024, 1024); spotB.shadow.radius = 5; spotB.shadow.bias = -0.0006;
scene.add(spotB, spotB.target);
const spotA = new THREE.SpotLight(0xc9d0dc, 26, 10, 0.32, 0.9, 1.5);
spotA.position.set(-1.25, 5.2, 1.2); spotA.target.position.set(-1.25, 0, 0); scene.add(spotA, spotA.target);

// Figur aus Kapseln
const white = new THREE.MeshStandardMaterial({ color: 0xf4f4f4, roughness: 0.45 });
function figure() {
  const cap = (r, l) => { const m = new THREE.Mesh(new THREE.CapsuleGeometry(r, l, 8, 16), white); m.castShadow = true; return m; };
  const g = new THREE.Group(); scene.add(g);
  const torso = cap(0.21, 0.36); torso.position.y = 1.22; g.add(torso);
  const neck = new THREE.Group(); neck.position.y = 1.64; g.add(neck);
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.25, 32, 24), white); head.castShadow = true; head.position.y = 0.2; neck.add(head);
  const limb = (x, y, r, l1, l2) => {
    const a = new THREE.Group(); a.position.set(x, y, 0); g.add(a);
    const u = cap(r, l1); u.position.y = -(l1 / 2 + r * 0.55); a.add(u);
    const b = new THREE.Group(); b.position.y = -(l1 + r * 1.1); a.add(b);
    const lo = cap(r * 0.94, l2); lo.position.y = -(l2 / 2 + r * 0.55); b.add(lo);
    return { a, b };
  };
  const f = { g, torso, neck,
    lL: limb(0.11, 0.93, 0.09, 0.3, 0.3), lR: limb(-0.11, 0.93, 0.09, 0.3, 0.3),
    aL: limb(0.28, 1.47, 0.066, 0.22, 0.22), aR: limb(-0.28, 1.47, 0.066, 0.22, 0.22) };
  f.aL.a.rotation.z = 0.07; f.aR.a.rotation.z = -0.07;
  return f;
}
const A = figure(), B = figure();
A.g.rotation.y = B.g.rotation.y = Math.PI / 2; // Blick nach rechts zur Treppe
A.g.position.set(-1.25, 0, 0.15);

const cl = (x) => Math.min(Math.max(x, 0), 1);
const smooth = (a, b, x) => { const t = cl((x - a) / (b - a)); return t * t * (3 - 2 * t); };
const inout = (x) => x * x * (3 - 2 * x);

const C0 = 2.6, SD = 0.95; // Start des Aufstiegs, Dauer pro Stufe
const la = document.getElementById("la"), lb = document.getElementById("lb");
const v = new THREE.Vector3();
function place(el, f, y, dx) {
  f.g.getWorldPosition(v); v.y += y; v.project(cam);
  el.style.left = ((v.x + 1) / 2 * 1080 + dx) + "px"; el.style.top = ((1 - v.y) / 2 * 1920) + "px";
}

function render(t) {
  // B steigt die Treppe hoch
  const s = Math.min(Math.max((t - C0) / SD, 0), N);
  const k = Math.floor(s), fr = s - k, e = inout(fr);
  const moving = s > 0 && s < N ? 1 : 0;
  const sp = k + e;
  const bx = X0 - 0.55 * RUN + sp * RUN, by = sp * RISE + Math.sin(Math.PI * fr) * 0.07 * moving;
  B.g.position.set(bx, by, 0.15);
  const ph = s * Math.PI;
  const w = moving * (1 - smooth(N - 0.3, N, s));
  B.lL.a.rotation.x = -Math.max(0, Math.sin(ph)) * 0.9 * w + Math.max(0, -Math.sin(ph)) * 0.25 * w;
  B.lR.a.rotation.x = -Math.max(0, -Math.sin(ph)) * 0.9 * w + Math.max(0, Math.sin(ph)) * 0.25 * w;
  B.lL.b.rotation.x = Math.max(0, Math.sin(ph)) * 1.1 * w;
  B.lR.b.rotation.x = Math.max(0, -Math.sin(ph)) * 1.1 * w;
  B.aL.a.rotation.x = Math.sin(ph) * 0.4 * w; B.aR.a.rotation.x = -Math.sin(ph) * 0.4 * w;
  B.aL.b.rotation.x = B.aR.b.rotation.x = -0.2 - 0.25 * w;
  B.torso.rotation.x = 0.08 * w;
  // Oben angekommen: dreht sich zur Kamera
  const top = smooth(C0 + N * SD + 0.3, C0 + N * SD + 1.1, t);
  B.g.rotation.y = Math.PI / 2 * (1 - top);

  // A wartet: Kopf gesenkt, am Ende schaut A hoch
  const up = smooth(13.6, 14.6, t);
  A.neck.rotation.x = 0.28 * (1 - up) - 0.5 * up;
  A.aL.b.rotation.x = A.aR.b.rotation.x = -0.12;
  A.torso.rotation.x = 0.04 * Math.sin(t * 1.6); // atmen

  // Stufen: die betretene leuchtet, die nächste ist nur zu ahnen
  for (let i = 0; i < N; i++) {
    const lit = cl((s - i - 0.75) / 0.25);
    const hint = cl((s - i + 0.4) / 0.4) * 0.35;
    const b = Math.max(lit, hint);
    edges[i].emissiveIntensity = 2.4 * lit + 0.5 * hint;
    steps[i].color.setRGB(0.06 + 0.34 * b, 0.06 + 0.34 * b, 0.065 + 0.33 * b);
  }
  // Licht folgt B
  spotB.position.set(bx + 0.2, by + 4.6, 1.3); spotB.target.position.set(bx, by, 0);
  spotA.intensity = 26 * (1 - 0.5 * smooth(9, 13, t));

  // Kamera: ruhige Fahrt nach oben
  const cy = 1.55 + 1.45 * smooth(2, 14, t);
  cam.position.set(0.3, cy + 0.6, 14.2 - 1.2 * smooth(0, 17, t)); cam.lookAt(0.3, cy, 0);
  renderer.render(scene, cam);

  place(la, A, 2.45, -95); place(lb, B, 2.45, 95);
}
window.addEventListener("hf-seek", (ev) => render(ev.detail.time));

const tl = gsap.timeline({ paused: true });
const IN = (s, t) => tl.fromTo(s, { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.7, ease: "power2.out" }, t);
const OUT = (s, t) => tl.to(s, { opacity: 0, duration: 0.5, ease: "none" }, t);
tl.set("#t1,#t2,#t3,#la,#lb", { opacity: 0 }, 0);
IN("#t1", 0.3); IN("#la", 1.0); IN("#lb", 1.3);
IN("#t2", 6.0);
OUT("#t1", 12.6); OUT("#t2", 12.6); OUT("#lb", 8.6);
IN("#t3", 14.4);
tl.to("#root", { opacity: 0, duration: 0.6, ease: "none" }, 16.4);
tl.eventCallback("onUpdate", () => render(tl.time()));
window.__timelines = window.__timelines || {}; window.__timelines["main"] = tl;
render(0);
</script></body></html>
