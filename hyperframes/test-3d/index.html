<!doctype html><html lang="de"><head><meta charset="UTF-8"/><meta name="viewport" content="width=1080, height=1920"/>
<script src="assets/gsap.min.js"></script>
<script type="importmap">{"imports":{"three":"./assets/three.module.min.js"}}</script>
<style>
@font-face{font-family:MO;src:url(assets/JetBrainsMono-Medium.ttf) format("truetype")}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#0b0b0d}
#root{width:1080px;height:1920px;position:relative;overflow:hidden;background:#0b0b0d}
#gl{position:absolute;inset:0;width:1080px;height:1920px}
.t{position:absolute;left:0;right:0;text-align:center;font-family:MO,monospace;letter-spacing:.24em;text-transform:uppercase;color:#d8d8dc}
</style></head><body>
<div id="root" data-composition-id="main" data-start="0" data-duration="9" data-width="1080" data-height="1920">
  <canvas id="gl" width="1080" height="1920"></canvas>
  <div class="t" id="t1" style="top:330px;font-size:40px">21:30</div>
  <div class="t" id="t2" style="top:400px;font-size:30px;color:#8e8e96">Der Laden ist zu.</div>
  <div class="t" id="t3" style="top:450px;font-size:30px;color:#3ad6c5">Das Handy nicht.</div>
  <div class="t" style="bottom:300px;font-size:18px;color:#3a3a40">walkzy</div>
</div>
<script type="module">
import * as THREE from "three";
import { Reflector } from "./assets/Reflector.js";
window.THREE = THREE;

const canvas = document.getElementById("gl");
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1); renderer.setSize(1080, 1920, false);
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.0;
renderer.outputColorSpace = THREE.SRGBColorSpace;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0b0b0d);
scene.fog = new THREE.Fog(0x0b0b0d, 9, 18);
const cam = new THREE.PerspectiveCamera(32, 1080 / 1920, 0.1, 50);

// Raum
const mirror = new Reflector(new THREE.PlaneGeometry(30, 30), { textureWidth: 540, textureHeight: 960, color: 0x777777 });
mirror.rotation.x = -Math.PI / 2; scene.add(mirror);
const floor = new THREE.Mesh(new THREE.PlaneGeometry(30, 30), new THREE.MeshStandardMaterial({ color: 0x101012, roughness: 0.55, transparent: true, opacity: 0.88 }));
floor.rotation.x = -Math.PI / 2; floor.position.y = 0.002; floor.receiveShadow = true; scene.add(floor);
const wall = new THREE.Mesh(new THREE.PlaneGeometry(30, 12), new THREE.MeshStandardMaterial({ color: 0x18181b, roughness: 0.9 }));
wall.position.set(0, 6, -2.6); wall.receiveShadow = true; scene.add(wall);

// Tresen + Handy
const dark = new THREE.MeshStandardMaterial({ color: 0x1d1d21, roughness: 0.6 });
const counter = new THREE.Mesh(new THREE.BoxGeometry(1.6, 1.0, 0.7), dark);
counter.position.set(1.55, 0.5, -0.3); counter.castShadow = counter.receiveShadow = true; scene.add(counter);
const top = new THREE.Mesh(new THREE.BoxGeometry(1.7, 0.05, 0.8), new THREE.MeshStandardMaterial({ color: 0x2c2c31, roughness: 0.4 }));
top.position.set(1.55, 1.025, -0.3); top.castShadow = top.receiveShadow = true; scene.add(top);
const phone = new THREE.Group(); phone.position.set(1.15, 1.16, -0.15); phone.rotation.x = -0.25; scene.add(phone);
phone.add(new THREE.Mesh(new THREE.BoxGeometry(0.15, 0.27, 0.02), new THREE.MeshStandardMaterial({ color: 0x0c0c0e, roughness: 0.3 })));
const scrMat = new THREE.MeshStandardMaterial({ color: 0x000000, emissive: 0x3ad6c5, emissiveIntensity: 0 });
const scr = new THREE.Mesh(new THREE.PlaneGeometry(0.13, 0.25), scrMat); scr.position.z = 0.011; phone.add(scr);
const phoneLight = new THREE.PointLight(0x3ad6c5, 0, 3, 2); phoneLight.position.set(1.15, 1.3, 0.1); scene.add(phoneLight);

// Lampe
const LX = 0.35;
const cord = new THREE.Mesh(new THREE.CylinderGeometry(0.008, 0.008, 4), new THREE.MeshStandardMaterial({ color: 0x333333 }));
cord.position.set(LX, 5.2, 0); scene.add(cord);
const shade = new THREE.Mesh(new THREE.SphereGeometry(0.32, 32, 16, 0, Math.PI * 2, 0, Math.PI / 2), new THREE.MeshStandardMaterial({ color: 0x1a1a1a, roughness: 0.5, side: THREE.DoubleSide }));
shade.position.set(LX, 3.05, 0); shade.scale.y = 0.6; scene.add(shade);
const bulbMat = new THREE.MeshStandardMaterial({ color: 0x000000, emissive: 0xffd7a0, emissiveIntensity: 3 });
const bulb = new THREE.Mesh(new THREE.SphereGeometry(0.07, 16, 8), bulbMat); bulb.position.set(LX, 3.03, 0); scene.add(bulb);
const spot = new THREE.SpotLight(0xffd9a8, 70, 12, 0.5, 0.75, 1.6);
spot.position.set(LX, 3.0, 0); spot.target.position.set(LX, 0, 0.2); spot.castShadow = true;
spot.shadow.mapSize.set(1024, 1024); spot.shadow.radius = 6; spot.shadow.bias = -0.0005;
scene.add(spot, spot.target);
scene.add(new THREE.HemisphereLight(0x8890a0, 0x050505, 0.12));

// Figur
const white = new THREE.MeshStandardMaterial({ color: 0xf2f2f2, roughness: 0.42 });
const cap = (r, l) => { const m = new THREE.Mesh(new THREE.CapsuleGeometry(r, l, 8, 16), white); m.castShadow = true; return m; };
const fig = new THREE.Group(); scene.add(fig);
const torso = cap(0.2, 0.34); torso.position.y = 1.2; fig.add(torso);
const head = new THREE.Mesh(new THREE.SphereGeometry(0.25, 32, 24), white); head.castShadow = true;
const neck = new THREE.Group(); neck.position.y = 1.62; fig.add(neck); head.position.y = 0.2; neck.add(head);
function limb(x, y, r, l1, l2) {
  const a = new THREE.Group(); a.position.set(x, y, 0); fig.add(a);
  const u = cap(r, l1); u.position.y = -(l1 / 2 + r * 0.6); a.add(u);
  const b = new THREE.Group(); b.position.y = -(l1 + r * 0.9); a.add(b);
  const lo = cap(r * 0.92, l2); lo.position.y = -(l2 / 2 + r * 0.6); b.add(lo);
  return { a, b };
}
const legL = limb(0, 0.92, 0.085, 0.3, 0.3), legR = limb(0, 0.92, 0.085, 0.3, 0.3);
const armL = limb(0, 1.46, 0.062, 0.22, 0.22), armR = limb(0, 1.46, 0.062, 0.22, 0.22);
legL.a.position.x = 0.11; legR.a.position.x = -0.11; armL.a.position.x = 0.27; armR.a.position.x = -0.27;

const ease = (x) => 1 - Math.pow(1 - Math.min(Math.max(x, 0), 1), 3);
const smooth = (a, b, x) => { const t = Math.min(Math.max((x - a) / (b - a), 0), 1); return t * t * (3 - 2 * t); };

function render(t) {
  // Gehen: 0 bis 4.2 s von links ins Licht
  const p = ease(t / 4.2), x0 = -2.4, x1 = 0.25;
  const x = x0 + (x1 - x0) * p;
  const dist = x - x0, ph = dist * 4.2;
  const walk = 1 - smooth(3.6, 4.3, t);
  fig.position.set(x, Math.abs(Math.sin(ph)) * 0.035 * walk, 0.2);
  // Blickrichtung: laufen nach rechts (+x), dann zur Kamera, dann zum Handy
  const turn = smooth(4.2, 4.9, t);
  fig.rotation.y = Math.PI / 2 * (1 - turn) + 0.25 * smooth(5.8, 6.4, t) * 0;
  legL.a.rotation.x = Math.sin(ph) * 0.55 * walk; legR.a.rotation.x = -Math.sin(ph) * 0.55 * walk;
  legL.b.rotation.x = Math.max(0, -Math.sin(ph - 0.6)) * 0.9 * walk; legR.b.rotation.x = Math.max(0, Math.sin(ph - 0.6)) * 0.9 * walk;
  armL.a.rotation.x = -Math.sin(ph) * 0.45 * walk; armR.a.rotation.x = Math.sin(ph) * 0.45 * walk;
  armL.b.rotation.x = -0.15 - 0.25 * walk; armR.b.rotation.x = -0.15 - 0.25 * walk;
  armL.a.rotation.z = 0.06; armR.a.rotation.z = -0.06;
  // Kopf: leicht gesenkt, dann Blick zum Handy (rechts vom Betrachter)
  const look = smooth(5.9, 6.5, t);
  neck.rotation.y = 0.9 * look * turn; neck.rotation.x = 0.12 * look;
  torso.rotation.y = 0.15 * look;
  // Handy leuchtet ab 5.6 s, pulsiert
  const on = smooth(5.6, 5.9, t), pulse = on * (0.8 + 0.2 * Math.sin(t * 6));
  scrMat.emissiveIntensity = 2.2 * pulse; phoneLight.intensity = 2.5 * pulse;
  // Kamera: langsame Fahrt
  const cz = 8.2 - 1.2 * smooth(0, 9, t);
  cam.position.set(0.35 + 0.15 * smooth(5, 9, t), 1.45, cz); cam.lookAt(0.45, 1.25, 0);
  renderer.render(scene, cam);
}
window.addEventListener("hf-seek", (e) => render(e.detail.time));

const tl = gsap.timeline({ paused: true });
tl.fromTo("#t1", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.6, ease: "power2.out" }, 0.3);
tl.fromTo("#t2", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.6, ease: "power2.out" }, 4.6);
tl.fromTo("#t3", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.6, ease: "power2.out" }, 6.0);
tl.to({}, { duration: 0.01 }, 8.99);
tl.eventCallback("onUpdate", () => render(tl.time()));
window.__timelines = window.__timelines || {}; window.__timelines["main"] = tl;
render(0);
</script></body></html>
